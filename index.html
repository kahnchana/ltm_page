<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IVRA</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f4f4f9;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .video-grid {
      width: 100%;
      max-width: 98%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 1rem;
      padding: 1rem;
    }

    .video-grid video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .video-caption {
      text-align: center;
      margin-top: 1rem;
      color: #666;
      font-size: 0.9rem;
    }

    .content-section {
      padding-top: 2rem;
    }

    .container {
      text-align: center;
      padding: 2rem 3rem;
      background: white;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      color: #4A90E2;
    }

    p {
      font-size: 1.25rem;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="video-grid" id="videoHeader">
      <video src="videos/vid01.webm" autoplay loop muted></video>
      <video src="videos/vid02.webm" autoplay loop muted></video>
      <video src="videos/vid03.webm" autoplay loop muted></video>
      <video src="videos/vid04.webm" autoplay loop muted></video>
      <video src="videos/vid10.webm" autoplay loop muted></video>
      <video src="videos/vid09.webm" autoplay loop muted></video>
      <video src="videos/vid07.webm" autoplay loop muted></video>
      <video src="videos/vid08.webm" autoplay loop muted></video>
      <video src="videos/vid06.webm" autoplay loop muted></video>
  </div>
  <div class="video-caption">
    <p>NOTE: Above videos are run at 3x speed for visualization purposes.</p>
  </div>

  <div class="content-section">
    <div class="container">
      <h1>LangToMo</h1>
      <p>A hierarchical vision–language–action framework for robot control.</p>
    </div>
  </div>
</body>
</html>
